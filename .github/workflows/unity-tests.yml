name: Unity Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Run EditMode and PlayMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: source
          testMode: editmode
          artifactsPath: test-results/editmode

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: source
          testMode: playmode
          artifactsPath: test-results/playmode

      - name: Upload EditMode results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: test-results/editmode

      - name: Upload PlayMode results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: test-results/playmode